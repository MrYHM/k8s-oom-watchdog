# Routing for the OOM watchdog alerts (rules in prometheus-rules.yaml).
#
# This example targets an Opsgenie-compatible gateway that fans out to an IM
# channel; the `details` keys below are that gateway's contract, not
# Alertmanager's. Replace the receiver with whatever your stack uses — only
# the route matcher (alertname =~ MemoryWatchdog.*) and the severity split
# are meant to be reused verbatim.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: memory-watchdog-alerts
  labels:
    alertmanagerConfig: "true"
spec:
  receivers:
    - name: memory-watchdog-alerts
      opsgenieConfigs:
          # Resolved notifications are on: these alerts fire on `increase(...)
          # > 0` over a trailing window, so "it stopped" is real information
          # (the node got capacity back, the mount was fixed) and closing the
          # loop keeps stale criticals out of the channel.
        - sendResolved: true
          apiKey:
            key: OPSGENIE_API_KEY
            name: opsgenie-key
          # The group can hold several pods; say so in the title instead of
          # silently showing only the first one.
          message: >-
            {{ (index .Alerts 0).Annotations.summary }}{{ if gt (len .Alerts) 1 }} (+{{ sub (len .Alerts) 1 }} more pods){{ end }}
          description: '{{ (index .Alerts 0).Annotations.description }}'
          # Severity drives priority: a critical means OOM rescue is already
          # degraded, a warning is a capacity/hygiene signal.
          priority: '{{ if eq (index .Alerts 0).Labels.severity "critical" }}P2{{ else }}P4{{ end }}'
          details:
            - key: environment
              value: "${environment}"
            - key: namespace
              value: "{{ (index .Alerts 0).Labels.namespace }}"
            - key: pod
              value: "{{ (index .Alerts 0).Labels.pod }}"
            - key: severity
              value: "{{ (index .Alerts 0).Labels.severity }}"
            - key: runbook
              value: "{{ (index .Alerts 0).Annotations.runbook_url }}"
            - key: useful_link_url
              value: "{{ (index .Alerts 0).GeneratorURL }}"
            - key: alert_category
              value: "memory_watchdog"
            - key: alert_source
              value: "Alertmanager"
            - key: to_mattermost
              value: "NO"
            - key: mattermost_channel
              value: ""
            - key: to_wecom
              value: "NO"
            - key: wecom_webhook
              value: ""
            - key: to_feishu
              value: "YES"
            - key: feishu_channel
              value: "your-alert-channel"
  route:
    receiver: memory-watchdog-alerts
    matchers:
      - name: alertname
        matchType: "=~"
        value: "MemoryWatchdog.*"
    groupBy: ['alertname', 'namespace']
    repeatInterval: 6h
    routes:
      # A critical means the target container is running without OOM rescue
      # right now, and only a human can restore it — remind hourly instead of
      # every 6h. Warnings keep the parent's quieter cadence.
      - receiver: memory-watchdog-alerts
        matchers:
          - name: severity
            value: "critical"
        groupBy: ['alertname', 'namespace']
        repeatInterval: 1h
