# Routing for the OOM watchdog alerts (rules in prometheus-rules.yaml).
#
# The receiver below is a placeholder you are expected to replace; the route
# is the part worth reusing verbatim. A webhook is used here because it needs
# no credentials and because Alertmanager's standard payload already carries
# everything these alerts convey:
#
#   labels.severity / .namespace / .pod
#   annotations.summary / .description / .runbook_url
#
# So there is usually nothing to map field by field. If your destination is
# Opsgenie, PagerDuty, Slack or similar, swap webhookConfigs for that
# receiver's own config block (opsgenieConfigs, pagerdutyConfigs,
# slackConfigs) and reference a Secret in this namespace for its credential.
# Two things are worth carrying over when you do:
#
#   * derive the destination's priority from `severity` -- a critical here
#     means OOM rescue is already degraded, a warning is a capacity signal
#   * a group can hold several pods, so put the count in the title rather
#     than silently showing only the first:
#       {{ (index .Alerts 0).Annotations.summary }}
#       {{- if gt (len .Alerts) 1 }} (+{{ sub (len .Alerts) 1 }} more pods){{ end }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: memory-watchdog-alerts
spec:
  receivers:
    - name: memory-watchdog-alerts
      webhookConfigs:
        # REPLACE ME.
        - url: http://alert-gateway.example.com/alerts
          # On by default here: these rules fire on `increase(...) > 0` over a
          # trailing window, so "it stopped" is real information (the node got
          # capacity back, the broken mount was fixed) and closing the loop
          # keeps stale criticals out of the channel.
          sendResolved: true
  route:
    receiver: memory-watchdog-alerts
    matchers:
      - name: alertname
        matchType: "=~"
        value: "MemoryWatchdog.*"
    # Group per alert per namespace: one notification for an alert affecting
    # several pods in a namespace, but never one notification spanning
    # namespaces, because the operator action differs per namespace.
    groupBy: ['alertname', 'namespace']
    repeatInterval: 6h
    routes:
      # A critical means a container is running without OOM rescue right now
      # and only a human can restore it -- remind hourly instead of every 6h.
      # Warnings keep the parent's quieter cadence.
      - receiver: memory-watchdog-alerts
        matchers:
          - name: severity
            value: "critical"
        groupBy: ['alertname', 'namespace']
        repeatInterval: 1h
