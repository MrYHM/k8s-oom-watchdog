{{- if and .Values.celeryWorker.enabled .Values.celeryWorker.watchdog.enabled .Values.celeryWorker.watchdog.admissionGuard -}}
{{- $watchdogSA := printf "system:serviceaccount:%s:%s-watchdog-sa" (.Values.namespace | required "Missing required namespace value") (include "app.celeryworker.fullname" .) -}}
# ValidatingAdmissionPolicy narrowing the watchdog SA's RBAC residual risk:
# RBAC cannot express "only your own pod / only these fields", so the Role
# grants pods+pods/resize patch namespace-wide. This policy pins every write
# by the SA to exactly what the watchdog is designed to do:
#   - only pods labelled name=celery-worker-heavy
#   - labels immutable (a label change could re-route Service selectors)
#   - annotations: only the two baseline keys may change
#   - main-resource updates must not touch spec at all
#   - resize updates may only change the celery-worker-heavy container's MEMORY
# Cluster-scoped objects: names carry the namespace so per-tenant releases
# never collide; the binding scopes enforcement to this tenant namespace.
# failurePolicy=Fail is safe here: matchConditions limit blast radius to the
# watchdog SA itself -- worst case its resize is denied and the
# CeleryWatchdogResizeFailed alert fires.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: celery-watchdog-guard-{{ .Values.namespace | required "Missing required namespace value" }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods", "pods/resize"]
  matchConditions:
    - name: watchdog-sa-only
      expression: "request.userInfo.username == '{{ $watchdogSA }}'"
  variables:
    - name: isResize
      expression: "request.subResource == 'resize'"
    - name: oldAnn
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
    - name: newAnn
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: allowedAnn
      expression: "['oom-watchdog.io/baseline-memory', 'oom-watchdog.io/baseline-requests']"
    - name: newC
      expression: "object.spec.containers.filter(c, c.name == 'celery-worker-heavy')"
    - name: oldC
      expression: "oldObject.spec.containers.filter(c, c.name == 'celery-worker-heavy')"
  validations:
    - expression: "has(object.metadata.labels) && ('name' in object.metadata.labels) && object.metadata.labels['name'] == 'celery-worker-heavy'"
      message: "watchdog SA may only modify pods labelled name=celery-worker-heavy"
      reason: Forbidden
    - expression: "(has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})"
      message: "watchdog SA must not change pod labels"
      reason: Forbidden
    - expression: "variables.newAnn.all(k, k in variables.allowedAnn || (k in variables.oldAnn && variables.newAnn[k] == variables.oldAnn[k])) && variables.oldAnn.all(k, k in variables.allowedAnn || k in variables.newAnn)"
      message: "watchdog SA may only write its two baseline annotations"
      reason: Forbidden
    - expression: "variables.isResize || object.spec == oldObject.spec"
      message: "watchdog SA must not change pod spec outside the resize subresource"
      reason: Forbidden
    - expression: "!variables.isResize || (variables.newC.size() == 1 && variables.oldC.size() == 1)"
      message: "resize target must contain exactly one celery-worker-heavy container"
      reason: Forbidden
    - expression: "!variables.isResize || object.spec.containers.all(c, c.name == 'celery-worker-heavy' || oldObject.spec.containers.filter(o, o.name == c.name)[0].resources == c.resources)"
      message: "watchdog SA may only resize the celery-worker-heavy container"
      reason: Forbidden
    - expression: "!variables.isResize || (variables.newC[0].resources.?limits.?cpu.orValue('') == variables.oldC[0].resources.?limits.?cpu.orValue('') && variables.newC[0].resources.?requests.?cpu.orValue('') == variables.oldC[0].resources.?requests.?cpu.orValue(''))"
      message: "watchdog SA may only change memory, not cpu"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: celery-watchdog-guard-{{ .Values.namespace }}
spec:
  policyName: celery-watchdog-guard-{{ .Values.namespace }}
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.namespace }}
{{- end }}
