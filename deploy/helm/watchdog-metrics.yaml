{{- if and .Values.worker.enabled .Values.worker.watchdog.enabled .Values.worker.watchdog.serviceMonitor -}}
# Headless Service + ServiceMonitor for the watchdog sidecar metrics.
# Assumes the Prometheus is configured with
# serviceMonitorSelectorNilUsesHelmValues=false and an empty namespace
# selector, so this is picked up automatically in any tenant namespace.
apiVersion: v1
kind: Service
metadata:
  name: heavy-worker-watchdog-metrics
  {{ include "app.namespace" . }}
  labels:
    name: heavy-worker-watchdog-metrics
    component: worker
    tenant: {{ .Values.tenant }}
spec:
  clusterIP: None
  selector:
    name: heavy-worker
  ports:
  - name: metrics
    port: {{ .Values.worker.watchdog.metricsPort | default 8090 }}
    # Numeric on purpose: the watchdog is a native sidecar (initContainer),
    # and numeric targetPorts don't depend on named-port resolution across
    # sidecar containers.
    targetPort: {{ .Values.worker.watchdog.metricsPort | default 8090 }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: heavy-worker-watchdog
  {{ include "app.namespace" . }}
  labels:
    name: heavy-worker-watchdog
    tenant: {{ .Values.tenant }}
spec:
  endpoints:
  - interval: 1m
    path: /metrics
    port: metrics
    scheme: http
  selector:
    matchLabels:
      name: heavy-worker-watchdog-metrics
{{- end }}
